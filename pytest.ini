[pytest]
# pytest config for the backend API test layer (Phase 3 of test-infrastructure
# plan). E2E tests live under tests/e2e/ and are driven by Playwright, not pytest.
testpaths = tests/api
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers --tb=short --junitxml=tests/.results/api.junit.xml
markers =
    slow: marks tests as slow (heartbeat timeout, etc.)
    realtime: WebSocket / broker tests
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:websockets.*
