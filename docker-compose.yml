services:
  app:
    build: .
    expose:
      - "9010"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aiaw:aiaw@postgres:5432/aiaw
      JWT_SECRET: ${JWT_SECRET:-please-set-a-long-random-value}
      JWT_EXPIRE_DAYS: "30"
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-aiaw}
      S3_REGION: ${S3_REGION:-auto}
      SEARXNG_URL: ${SEARXNG_URL:-}
    networks:
      - ai-network
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiaw
      POSTGRES_PASSWORD: aiaw
      POSTGRES_DB: aiaw
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aiaw"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

volumes:
  pg-data:

networks:
  ai-network:
    external: true
  internal:
    internal: true
